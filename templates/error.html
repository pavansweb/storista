{% extends "base.html" %}

{% block title %}Error | Storista{% endblock %}

{% block content %}
<div class="error-container fade-up">
  <div class="glass-card error-card text-center">
    <div class="error-icon-wrapper" aria-hidden="true">
      <i class="bi bi-exclamation-triangle-fill"></i>
    </div>
    <h1 class="error-title">An Error Occurred</h1>
    <p class="error-description">
      {{ error if error else 'The requested resource could not be found or an unexpected error occurred.' }}
    </p>
    <div class="error-actions">
      <a href="{{ url_for('web.index') }}" class="btn-glass btn-primary-glass">
        <i class="bi bi-arrow-left me-2" aria-hidden="true"></i> Return to Storage
      </a>
    </div>
  </div>
</div>
{% endblock %}
